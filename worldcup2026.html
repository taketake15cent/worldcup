<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA WORLD CUP 2026 【bcg】</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBztnrS1mf7VDB0L-oJFMc_fRyMIMuXmBk",
    authDomain: "worldcup-aa5a8.firebaseapp.com",
    databaseURL: "https://worldcup-aa5a8-default-rtdb.firebaseio.com",
    projectId: "worldcup-aa5a8",
    storageBucket: "worldcup-aa5a8.firebasestorage.app",
    messagingSenderId: "384163407931",
    appId: "1:384163407931:web:48ecf1ee689105f044d41e"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  window._fbDb     = db;
  window._fbRef    = ref;
  window._fbSet    = set;
  window._fbOnValue = onValue;
  window._fbRemove = remove;
  window._fbReady  = true;
  window.dispatchEvent(new Event("fbReady"));
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F5C800; }
  input { -webkit-appearance: none; }
  input:focus { border-color: #F5C800 !important; outline: none; }
  ::-webkit-input-placeholder { color: rgba(255,255,255,0.3); }
  button { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const POINTS = {
  opening_score:100000000,
  champion_win:300000000, champion_runner:100000000,
  topscorer_1:300000000, topscorer_2:100000000,
  mvp:300000000, japan_group:300000000, japan_rank:200000000,
  japan_scorer:200000000, red_card:300000000, most_conceded:300000000,
};

const formatP = (n) => {
  if (n>=100000000) return (n/100000000).toFixed(0)+"億P";
  if (n>=10000) return (n/10000).toFixed(0)+"万P";
  return n+"P";
};

const TABS = ["予想入力","みんなの予想","結果入力","順位表"];

const emptyEntry = {
  name:"", opening_score:"", champion:"", topscorer:"", mvp:"",
  japan_group:"", japan_rank:"", japan_scorer:"", red_card:"", most_conceded:"",
};
const emptyResults = {
  opening_score:"", champion:"", runner:"",
  topscorer_1:"", topscorer_2:"", mvp:"",
  japan_group:"", japan_rank:"",
  japan_scorer:"", red_card:"", most_conceded:"",
};

const splitMulti = (str) => str.split(/[,、\s]+/).map(s=>s.trim()).filter(Boolean);

function calcPoints(entry, results) {
  let t = 0;
  if (results.opening_score && entry.opening_score && entry.opening_score.trim()===results.opening_score.trim()) t+=POINTS.opening_score;
  if (results.champion && entry.champion===results.champion) t+=POINTS.champion_win;
  else if (results.runner && entry.champion===results.runner) t+=POINTS.champion_runner;
  if (results.topscorer_1 && entry.topscorer===results.topscorer_1) t+=POINTS.topscorer_1;
  else if (results.topscorer_2 && entry.topscorer===results.topscorer_2) t+=POINTS.topscorer_2;
  if (results.mvp && entry.mvp===results.mvp) t+=POINTS.mvp;
  if (results.japan_group && entry.japan_group===results.japan_group) t+=POINTS.japan_group;
  if (results.japan_rank && entry.japan_rank===results.japan_rank) t+=POINTS.japan_rank;
  if (results.japan_scorer && splitMulti(results.japan_scorer).includes(entry.japan_scorer)) t+=POINTS.japan_scorer;
  if (results.red_card && entry.red_card && splitMulti(results.red_card).includes(entry.red_card.trim())) t+=POINTS.red_card;
  if (results.most_conceded && splitMulti(results.most_conceded).includes(entry.most_conceded)) t+=POINTS.most_conceded;
  return t;
}

const fields = [
  { key:"opening_score", label:"① 開幕戦スコア（MX vs SA）", placeholder:"例）2-1",           hint:"メキシコvs南アフリカ・正解=1億P" },
  { key:"champion",      label:"② 優勝国",                   placeholder:"例）ブラジル",       hint:"1人予想・優勝=3億P / 準優勝=1億P" },
  { key:"topscorer",     label:"③ 得点王",                   placeholder:"例）エムバペ",       hint:"1人予想・1位=3億P / 2位=1億P" },
  { key:"mvp",           label:"④ MVP",                      placeholder:"例）メッシ",         hint:"正解=3億P" },
  { key:"japan_group",   label:"⑤ 日本予選成績",             placeholder:"例）2勝1分",         hint:"正解=3億P" },
  { key:"japan_rank",    label:"⑥ 日本最終順位",             placeholder:"例）ベスト8",        hint:"1人予想・正解=2億P" },
  { key:"japan_scorer",  label:"⑦ 日本得点王",               placeholder:"例）久保建英",       hint:"1人予想・正解=2億P" },
  { key:"red_card",      label:"⑧ 退場者",                   placeholder:"例）ネイマール",     hint:"1人予想・正解=3億P" },
  { key:"most_conceded", label:"⑨ 最多失点国",               placeholder:"例）サウジアラビア", hint:"正解=3億P" },
];

const resultFields = [
  { key:"opening_score", label:"① 開幕戦スコア（MX vs SA）", multi:false },
  { key:"champion",      label:"② 優勝国",                   multi:false },
  { key:"runner",        label:"　 準優勝国",                 multi:false },
  { key:"topscorer_1",   label:"③ 得点王 1位",               multi:false },
  { key:"topscorer_2",   label:"　 得点王 2位",               multi:false },
  { key:"mvp",           label:"④ MVP",                      multi:false },
  { key:"japan_group",   label:"⑤ 日本予選成績",             multi:false },
  { key:"japan_rank",    label:"⑥ 日本最終順位",             multi:false },
  { key:"japan_scorer",  label:"⑦ 日本得点王",               multi:true, multiNote:"複数いればカンマ区切り" },
  { key:"red_card",      label:"⑧ 退場者",                   multi:true, multiNote:"複数いればカンマ区切り" },
  { key:"most_conceded", label:"⑨ 最多失点国",               multi:true, multiNote:"複数あればカンマ区切り" },
];

const Y="#F5C800", R="#CC0000", B="#1A3A8F", BK="#111111", W="#FFFFFF";
const card = {background:"rgba(0,0,0,0.65)",borderRadius:12,border:"1px solid rgba(255,255,255,0.12)",padding:20};
const inp  = {width:"100%",padding:"11px 12px",background:"rgba(0,0,0,0.6)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:W,fontSize:14,outline:"none",display:"block"};

function Field({label,hint,children}){
  return(
    <div style={{marginBottom:16}}>
      <div style={{fontSize:14,fontWeight:800,color:W,marginBottom:hint?3:8}}>{label}</div>
      {hint&&<div style={{fontSize:11,color:"rgba(245,200,0,0.9)",marginBottom:8}}>{hint}</div>}
      {children}
    </div>
  );
}
function Empty({text}){return <div style={{textAlign:"center",color:"rgba(255,255,255,0.35)",padding:50}}>{text}</div>;}

function App(){
  const [fbReady, setFbReady]       = React.useState(!!window._fbReady);
  const [tab, setTab]               = React.useState(0);
  const [entries, setEntries]       = React.useState([]);
  const [results, setResults]       = React.useState(emptyResults);
  const [form, setForm]             = React.useState(emptyEntry);
  const [saved, setSaved]           = React.useState(false);
  const [editIdx, setEditIdx]       = React.useState(null);
  const [showModal, setShowModal]   = React.useState(false);

  // Firebase準備待ち
  React.useEffect(()=>{
    if(window._fbReady){ setFbReady(true); return; }
    const h = ()=>setFbReady(true);
    window.addEventListener("fbReady", h);
    return ()=>window.removeEventListener("fbReady", h);
  },[]);

  // リアルタイム購読
  React.useEffect(()=>{
    if(!fbReady) return;
    const db=window._fbDb, r=window._fbRef, ov=window._fbOnValue;
    const unsubE = ov(r(db,"entries"), snap=>{
      const val=snap.val();
      setEntries(val ? Object.values(val) : []);
    });
    const unsubR = ov(r(db,"results"), snap=>{
      const val=snap.val();
      if(val) setResults(val);
    });
    return ()=>{ unsubE(); unsubR(); };
  },[fbReady]);

  const saveEntry = (entry, idx) => {
    const db=window._fbDb, r=window._fbRef, s=window._fbSet;
    s(r(db,`entries/${idx}`), entry);
  };
  const deleteEntry = (idx) => {
    const db=window._fbDb, r=window._fbRef, rm=window._fbRemove;
    rm(r(db,`entries/${idx}`));
  };
  const saveResults = (data) => {
    const db=window._fbDb, r=window._fbRef, s=window._fbSet;
    setResults(data);
    s(r(db,"results"), data);
  };

  const handleEdit   = (idx)=>{ setForm({...entries[idx]}); setEditIdx(idx); setShowModal(true); };
  const handleDelete = (idx, name)=>{
    if(!window.confirm(`「${name}」の予想を削除しますか？`)) return;
    deleteEntry(idx);
  };
  const handleSubmit = ()=>{
    if(!form.name.trim()) return alert("名前を入力してください");
    if(editIdx!==null){
      saveEntry({...form}, editIdx);
      setEditIdx(null); setShowModal(false);
    } else {
      saveEntry({...form}, entries.length);
    }
    setForm(emptyEntry);
    setSaved(true);
    setTimeout(()=>setSaved(false), 2500);
  };
  const handleModalClose = ()=>{ setShowModal(false); setEditIdx(null); setForm(emptyEntry); };

  const ranked = [...entries].map(e=>({...e,points:calcPoints(e,results)})).sort((a,b)=>b.points-a.points);

  if(!fbReady) return(
    <div style={{minHeight:"100vh",background:"#0b1a5e",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{fontSize:40}}>⚽</div>
      <div style={{color:Y,fontSize:16,fontWeight:700}}>接続中...</div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",fontFamily:"'Hiragino Sans','Segoe UI',sans-serif",color:W,position:"relative",overflowX:"hidden"}}>

      {/* 背景 */}
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none"}}>
        <div style={{position:"absolute",inset:0,background:Y}}/>
        <div style={{position:"absolute",inset:0,opacity:0.55,background:`repeating-linear-gradient(90deg,transparent 0%,transparent 16.5%,${R} 16.5%,${R} 33%,transparent 33%,transparent 49.5%,${R} 49.5%,${R} 66%,transparent 66%,transparent 82.5%,${R} 82.5%,${R} 99%)`}}/>
        <div style={{position:"absolute",top:0,left:0,width:"18%",height:"22%",background:B,opacity:0.7,clipPath:"polygon(0 0,100% 0,70% 100%,0 100%)"}}/>
        <div style={{position:"absolute",top:0,right:0,width:"18%",height:"22%",background:B,opacity:0.7,clipPath:"polygon(0 0,100% 0,100% 100%,30% 100%)"}}/>
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.45)"}}/>
      </div>

      {/* 編集モーダル */}
      {showModal&&(
        <div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 16px"}}>
          <div style={{background:"#0d0d1a",border:`2px solid ${Y}`,borderRadius:14,padding:24,width:"100%",maxWidth:500}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:900,color:Y}}>✏️ 予想を編集</div>
              <button onClick={handleModalClose} style={{background:"rgba(255,255,255,0.1)",border:"none",borderRadius:"50%",width:32,height:32,color:W,fontSize:16,cursor:"pointer"}}>✕</button>
            </div>
            <Field label="お名前 *"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="あなたの名前" style={inp}/></Field>
            {fields.map(f=>(
              <Field key={f.key} label={f.label} hint={f.hint}>
                <input value={form[f.key]||""} onChange={e=>setForm({...form,[f.key]:e.target.value})} placeholder={f.placeholder} style={inp}/>
              </Field>
            ))}
            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button onClick={handleModalClose} style={{flex:1,padding:13,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:W,fontWeight:700,fontSize:14,cursor:"pointer"}}>キャンセル</button>
              <button onClick={handleSubmit} style={{flex:2,padding:13,background:`linear-gradient(90deg,${R},#ff3333)`,border:`2px solid ${Y}`,borderRadius:8,color:W,fontWeight:900,fontSize:14,cursor:"pointer"}}>更新する ✓</button>
            </div>
          </div>
        </div>
      )}

      {/* ヘッダー */}
      <header style={{position:"relative",zIndex:10,textAlign:"center"}}>
        <div style={{height:6,background:R}}/><div style={{height:3,background:Y}}/><div style={{height:6,background:B}}/>
        <div style={{background:"rgba(0,0,0,0.65)",padding:"20px 16px 16px"}}>
          <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:54,height:54,borderRadius:"50%",background:R,border:`3px solid ${Y}`,fontSize:28,marginBottom:10}}>⚽</div>
          <div style={{fontSize:22,fontWeight:900,letterSpacing:3,color:W,textShadow:`0 2px 0 ${R}`}}>FIFA WORLD CUP 2026</div>
          <div style={{display:"inline-block",marginTop:10,padding:"5px 20px",background:`linear-gradient(90deg,${R},#ff2222)`,border:`2px solid ${Y}`,borderRadius:4,fontSize:15,fontWeight:900,letterSpacing:6,color:W}}>【bcg】</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.55)",marginTop:10,letterSpacing:2}}>参加者 {entries.length}人</div>
        </div>
        <div style={{height:6,background:B}}/><div style={{height:3,background:Y}}/><div style={{height:6,background:R}}/>
      </header>

      {/* タブ */}
      <nav style={{position:"relative",zIndex:10,display:"flex",background:"rgba(0,0,0,0.7)",borderBottom:`2px solid ${Y}`}}>
        {TABS.map((t,i)=>(
          <button key={i} onClick={()=>setTab(i)} style={{flex:1,padding:"13px 2px",border:"none",cursor:"pointer",background:tab===i?"rgba(245,200,0,0.18)":"transparent",color:tab===i?Y:"rgba(255,255,255,0.4)",borderBottom:tab===i?`3px solid ${Y}`:"3px solid transparent",fontSize:11,fontWeight:tab===i?800:400}}>
            {t}
          </button>
        ))}
      </nav>

      <main style={{position:"relative",zIndex:10,padding:"20px 16px",maxWidth:600,margin:"0 auto"}}>

        {/* TAB0: 予想入力 */}
        {tab===0&&(
          <div style={card}>
            <div style={{fontSize:15,fontWeight:900,color:Y,marginBottom:18}}>📝 予想を入力</div>
            <Field label="お名前 *"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="あなたの名前" style={inp}/></Field>
            {fields.map(f=>(
              <Field key={f.key} label={f.label} hint={f.hint}>
                <input value={form[f.key]||""} onChange={e=>setForm({...form,[f.key]:e.target.value})} placeholder={f.placeholder} style={inp}/>
              </Field>
            ))}
            <button onClick={handleSubmit} style={{width:"100%",padding:14,marginTop:10,background:`linear-gradient(90deg,${R},#ff3333)`,border:`2px solid ${Y}`,borderRadius:8,color:W,fontWeight:900,fontSize:15,letterSpacing:2,cursor:"pointer"}}>
              予想を登録する ⚽
            </button>
            {saved&&<div style={{marginTop:12,textAlign:"center",color:"#4cda8a",fontSize:14,fontWeight:700}}>✅ 登録完了！</div>}
          </div>
        )}

        {/* TAB1: みんなの予想 */}
        {tab===1&&(
          entries.length===0?<Empty text="まだ予想がありません"/>:
          <>
            <div style={{...card,marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:900,color:Y,marginBottom:12}}>✏️ 編集・削除</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {entries.map((e,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(0,0,0,0.5)",borderRadius:8,padding:"10px 12px",borderLeft:`3px solid ${Y}`}}>
                    <span style={{fontWeight:800,fontSize:15,color:W}}>{e.name}</span>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>handleEdit(i)} style={{padding:"7px 16px",border:"none",borderRadius:6,background:B,color:W,cursor:"pointer",fontSize:12,fontWeight:700}}>✏️ 編集</button>
                      <button onClick={()=>handleDelete(i,e.name)} style={{padding:"7px 16px",border:"none",borderRadius:6,background:R,color:W,cursor:"pointer",fontSize:12,fontWeight:700}}>🗑 削除</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
            {fields.map(f=>(
              <div key={f.key} style={{...card,marginBottom:14}}>
                <div style={{marginBottom:12,paddingBottom:10,borderBottom:`1px solid rgba(245,200,0,0.35)`,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                  <span style={{fontWeight:900,fontSize:17,color:Y}}>{f.label}</span>
                  <span style={{fontSize:11,color:"rgba(245,200,0,0.7)",flexShrink:0}}>{f.hint}</span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {entries.map((e,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(0,0,0,0.4)",borderRadius:8,padding:"9px 14px",borderLeft:`3px solid ${e[f.key]?Y:"rgba(255,255,255,0.08)"}`}}>
                      <span style={{fontSize:13,fontWeight:800,color:Y,minWidth:75,flexShrink:0}}>{e.name}</span>
                      <span style={{fontSize:14,fontWeight:e[f.key]?700:400,color:e[f.key]?W:"rgba(255,255,255,0.25)"}}>{e[f.key]||"未入力"}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </>
        )}

        {/* TAB2: 結果入力 */}
        {tab===2&&(
          <div style={card}>
            <div style={{fontSize:15,fontWeight:900,color:Y,marginBottom:6}}>🏆 大会結果を入力</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:18}}>結果確定後に入力。自動でポイント計算されます。</div>
            {resultFields.map(f=>(
              <Field key={f.key} label={f.label} hint={f.multi?`※ ${f.multiNote}`:null}>
                <input value={results[f.key]||""} onChange={e=>saveResults({...results,[f.key]:e.target.value})}
                  placeholder={f.multi?"複数ならカンマ区切り":f.label+"を入力"}
                  style={{...inp,borderColor:f.multi?"rgba(245,200,0,0.5)":"rgba(255,255,255,0.2)"}}/>
              </Field>
            ))}
            <div style={{marginTop:10,padding:10,background:"rgba(76,218,138,0.1)",borderRadius:8,border:"1px solid rgba(76,218,138,0.3)",fontSize:11,color:"#4cda8a"}}>
              ✅ 入力内容はリアルタイムで全員に反映されます
            </div>
          </div>
        )}

        {/* TAB3: 順位表 */}
        {tab===3&&(
          ranked.length===0?<Empty text="まだ参加者がいません"/>:
          <>
            <div style={{textAlign:"center",marginBottom:16,fontSize:11,color:"rgba(255,255,255,0.4)"}}>
              {Object.values(results).some(v=>v)?"🏆 暫定順位":"📊 参加者一覧（結果入力後ポイント確定）"}
            </div>
            {ranked.map((e,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:12,background:i===0?`linear-gradient(90deg,rgba(245,200,0,0.22),rgba(245,200,0,0.05))`:"rgba(0,0,0,0.45)",borderRadius:10,padding:"14px 16px",marginBottom:10,border:i===0?`1px solid rgba(245,200,0,0.6)`:"1px solid rgba(255,255,255,0.08)"}}>
                <div style={{width:40,height:40,borderRadius:"50%",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",background:i===0?Y:i===1?"#607080":i===2?"#7a5030":"rgba(255,255,255,0.1)",border:i===0?`2px solid ${W}`:"2px solid transparent",fontWeight:900,fontSize:i<3?18:14,color:i===0?BK:W}}>
                  {i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:16,color:W}}>{e.name}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.32)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {e.champion&&`優勝：${e.champion}`}{e.topscorer&&`　得点王：${e.topscorer}`}
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:18,fontWeight:900,color:i===0?Y:"rgba(255,255,255,0.85)"}}>{formatP(e.points)}</div>
                  {i===0&&e.points>0&&<div style={{fontSize:10,color:Y,fontWeight:700,marginTop:2}}>👑 総取り！</div>}
                </div>
              </div>
            ))}
          </>
        )}
      </main>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
